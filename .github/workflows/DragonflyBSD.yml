name: DragonflyBSD
on:
  push:
    branches:
      - '*'
    paths:
      - '**.c'
      - '**.h'
      - 'compat/*'
      - 'configure.ac'
      - 'Makefile.am'
      - '.github/workflows/DragonflyBSD.yml'
  pull_request:
    branches:
      - '*'
    paths:
      - '**.c'
      - '**.h'
      - 'compat/*'
      - 'configure.ac'
      - 'Makefile.am'
      - '.github/workflows/DragonflyBSD.yml'



jobs:
  DragonflyBSD:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: vmactions/dragonflybsd-vm@v1
      with:
        release: "6"
        prepare: |
          pkg install -y  automake autoconf libtool pkgconf libevent msgpack-c libssh gsed
        usesh: true
        run: |
          gsed -i "s/OK/0/g"  tty-term.c
          autoupdate
          ./autogen.sh
          ./configure
          make
          make install



